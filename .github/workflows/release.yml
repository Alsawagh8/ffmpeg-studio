name: Build Releases (Flatpak, AppImage & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Cargo Dependencies Offline
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          mkdir -p .cargo
          "$HOME/.cargo/bin/cargo" vendor > .cargo/config.toml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: FFmpeg-Studio-x86_64.flatpak
          manifest-path: org.archlinux.FfmpegGui.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FFmpeg-Studio-x86_64.flatpak

  build-linux-appimage:
    name: Build Linux AppImage & Tarball
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch Build Dependencies
        run: |
          pacman -Syu --noconfirm --needed rust base-devel pkgconf gtk4 libadwaita curl ca-certificates file appstream desktop-file-utils
      - name: Build Release Binary
        run: cargo build --release
      - name: Create Portable Linux Archive
        run: |
          mkdir -p FFmpeg-Studio-Linux-x86_64
          cp target/release/ffmpeg-gui FFmpeg-Studio-Linux-x86_64/
          cp assets/ffmpeg-studio.svg FFmpeg-Studio-Linux-x86_64/
          cp install.sh README.md FFmpeg-Studio-Linux-x86_64/
          tar -czvf FFmpeg-Studio-Linux-x86_64.tar.gz FFmpeg-Studio-Linux-x86_64
      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/ffmpeg-gui AppDir/usr/bin/
          cp assets/ffmpeg-studio.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          cat << 'DESKTOP' > AppDir/usr/share/applications/ffmpeg-studio.desktop
          [Desktop Entry]
          Name=FFmpeg Studio
          Exec=ffmpeg-gui
          Icon=ffmpeg-studio
          Type=Application
          Categories=AudioVideo;
          DESKTOP
          cat << 'APPRUN' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/ffmpeg-gui" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          cp AppDir/usr/share/applications/ffmpeg-studio.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/scalable/apps/ffmpeg-studio.svg AppDir/
          curl -fSL "https://github.com" -o appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir FFmpeg-Studio-x86_64.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            FFmpeg-Studio-x86_64.AppImage
            FFmpeg-Studio-Linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
      - name: Build Windows Binary
        shell: msys2 {0}
        run: export PATH="/ucrt64/bin:$PATH" && cargo build --release
      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path FFmpeg-Studio-Windows/share/glib-2.0/schemas | Out-Null
          Copy-Item target/release/ffmpeg-gui.exe FFmpeg-Studio-Windows/
          Copy-Item C:\msys64\ucrt64\bin\*.dll FFmpeg-Studio-Windows/ -ErrorAction SilentlyContinue
          Copy-Item C:\msys64\ucrt64\share\glib-2.0\schemas\gschemas.compiled FFmpeg-Studio-Windows/share/glib-2.0/schemas/ -ErrorAction SilentlyContinue
          Compress-Archive -Path FFmpeg-Studio-Windows -DestinationPath FFmpeg-Studio-Windows-x64.zip -Force
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FFmpeg-Studio-Windows-x64.zip
