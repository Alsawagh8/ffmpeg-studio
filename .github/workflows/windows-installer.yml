name: Build Full Windows Installer (Signed Setup.exe)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'installer.iss'
      - 'build.rs'
      - 'src/main.rs'

permissions:
  contents: write

jobs:
  build-windows-setup:
    name: Build & Sign Standalone Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-imagemagick
      - name: Generate Standard Windows ICO & Build Binary in MSYS2
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          for sz in 16 32 48 64 128 256; do
            rsvg-convert -w $sz -h $sz assets/ffmpeg-studio.svg -o "icon_${sz}.png"
          done
          magick icon_16.png icon_32.png icon_48.png icon_64.png icon_128.png icon_256.png assets/ffmpeg-studio.ico
          cargo build --release
          mkdir -p FFmpeg-Studio-Windows/share/glib-2.0/schemas FFmpeg-Studio-Windows/share/icons/hicolor/scalable/apps
          cp target/release/ffmpeg-gui.exe FFmpeg-Studio-Windows/
          cp /ucrt64/bin/ffmpeg.exe FFmpeg-Studio-Windows/
          cp /ucrt64/bin/ffprobe.exe FFmpeg-Studio-Windows/
          cp /ucrt64/bin/*.dll FFmpeg-Studio-Windows/ 2>/dev/null || true
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled FFmpeg-Studio-Windows/share/glib-2.0/schemas/ 2>/dev/null || true
          cp -r /ucrt64/share/icons/Adwaita FFmpeg-Studio-Windows/share/icons/ 2>/dev/null || true
          cp -r /ucrt64/share/icons/hicolor/* FFmpeg-Studio-Windows/share/icons/hicolor/ 2>/dev/null || true
          cp assets/ffmpeg-studio.svg FFmpeg-Studio-Windows/share/icons/hicolor/scalable/apps/org.archlinux.FfmpegGui.svg
          gtk4-update-icon-cache -f -t FFmpeg-Studio-Windows/share/icons/hicolor 2>/dev/null || true
      - name: Sign Application & Compile Signed Installer
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Alsawagh8, O=FFmpeg Studio" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath "FFmpeg-Studio-Cert.cer" | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint "FFmpeg-Studio-Windows\ffmpeg-gui.exe"
          iscc installer.iss
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint "FFmpeg-Studio-Windows-Setup.exe"
      - name: Upload Updated Windows Setup to v0.3.8 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.8
          files: |
            FFmpeg-Studio-Windows-Setup.exe
            FFmpeg-Studio-Cert.cer
