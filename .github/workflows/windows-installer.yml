name: Build Full Windows Installer (Setup.exe)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'installer.iss'
      - 'src/main.rs'

permissions:
  contents: write

jobs:
  build-windows-setup:
    name: Build Standalone Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Build Windows GUI Binary
        shell: msys2 {0}
        run: export PATH="/ucrt64/bin:$PATH" && cargo build --release
      - name: Bundle Runtime, GTK4 DLLs & FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path FFmpeg-Studio-Windows/share/glib-2.0/schemas | Out-Null
          New-Item -ItemType Directory -Force -Path FFmpeg-Studio-Windows/share/icons | Out-Null
          Copy-Item target/release/ffmpeg-gui.exe FFmpeg-Studio-Windows/
          Copy-Item C:\msys64\ucrt64\bin\ffmpeg.exe FFmpeg-Studio-Windows/
          Copy-Item C:\msys64\ucrt64\bin\ffprobe.exe FFmpeg-Studio-Windows/
          Copy-Item C:\msys64\ucrt64\bin\*.dll FFmpeg-Studio-Windows/ -ErrorAction SilentlyContinue
          Copy-Item C:\msys64\ucrt64\share\glib-2.0\schemas\gschemas.compiled FFmpeg-Studio-Windows/share/glib-2.0/schemas/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse C:\msys64\ucrt64\share\icons\Adwaita FFmpeg-Studio-Windows/share/icons/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse C:\msys64\ucrt64\share\icons\hicolor FFmpeg-Studio-Windows/share/icons/ -ErrorAction SilentlyContinue
      - name: Compile Windows Installer (Setup.exe)
        shell: pwsh
        run: iscc installer.iss
      - name: Upload Setup.exe to v0.3.5 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.5
          files: FFmpeg-Studio-Windows-Setup.exe
