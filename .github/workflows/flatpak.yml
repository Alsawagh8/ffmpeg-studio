name: Build Flatpak Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor Cargo & Download Static FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cargo bundled-bin ff-tmp
          cargo vendor > .cargo/config.toml
          gh release download latest -R BtbN/FFmpeg-Builds -p "ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf ffmpeg-master-latest-linux64-gpl.tar.xz -C ff-tmp --strip-components=1
          cp ff-tmp/bin/ffmpeg ff-tmp/bin/ffprobe bundled-bin/
          rm -rf ff-tmp ffmpeg-master-latest-linux64-gpl.tar.xz
      - name: Install Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build & Bundle Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir io.github.Alsawagh8.FfmpegStudio.yml
          flatpak build-bundle repo FFmpeg-Studio-x86_64.flatpak io.github.Alsawagh8.FfmpegStudio
      - name: Upload Flatpak to v0.3.6 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: FFmpeg-Studio-x86_64.flatpak
