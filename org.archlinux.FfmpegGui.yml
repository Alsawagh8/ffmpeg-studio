app-id: org.archlinux.FfmpegGui
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ffmpeg-gui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  - name: ffmpeg-gui
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
    build-commands:
      - install -Dm755 bundled-bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 bundled-bin/ffprobe /app/bin/ffprobe
      - cargo build --release --offline
      - install -Dm755 target/release/ffmpeg-gui /app/bin/ffmpeg-gui
      - install -Dm644 assets/ffmpeg-studio.svg /app/share/icons/hicolor/scalable/apps/org.archlinux.FfmpegGui.svg
      - install -Dm644 assets/org.archlinux.FfmpegGui.desktop /app/share/applications/org.archlinux.FfmpegGui.desktop
      - install -Dm644 assets/org.archlinux.FfmpegGui.metainfo.xml /app/share/metainfo/org.archlinux.FfmpegGui.metainfo.xml
    sources:
      - type: dir
        path: .
