app-id: io.github.Alsawagh8.FfmpegStudio
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ffmpeg-gui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  - name: ffmpeg-static
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 bin/ffprobe /app/bin/ffprobe
    sources:
      - type: archive
        url: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        sha256: a2d0cb34b2cf45d738927246d4cf9d8bfddeaac66964960142b5c1fbef6e0f70

  - name: ffmpeg-studio
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/ffmpeg-studio/cargo
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/ffmpeg-gui /app/bin/ffmpeg-gui
      - install -Dm644 assets/ffmpeg-studio.svg /app/share/icons/hicolor/scalable/apps/io.github.Alsawagh8.FfmpegStudio.svg
      - install -Dm644 assets/io.github.Alsawagh8.FfmpegStudio.desktop /app/share/applications/io.github.Alsawagh8.FfmpegStudio.desktop
      - install -Dm644 assets/io.github.Alsawagh8.FfmpegStudio.metainfo.xml /app/share/metainfo/io.github.Alsawagh8.FfmpegStudio.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/Alsawagh8/ffmpeg-studio/archive/refs/tags/v0.4.3.tar.gz
        sha256: 250889c9a36baa265890f9b4d5097ae979f0c65aa3ccbd623edfc1869f587d47
      - cargo-sources.json
